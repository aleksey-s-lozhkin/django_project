[tool.poetry]
name = "djangoproject"
version = "0.1.0"
description = ""
authors = ["Aleksey Lozhkin <aleksey.s.lozhkin@gmail.com>"]
readme = "README.md"
license = ""
packages = [{include = "djangoproject"}]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
django = ">=6.0,<7.0"
python-dotenv = "^1.0.0"
psycopg2-binary = "^2.9.9"
pillow = "^10.3.0"
certifi = "^2026.1.4"

[tool.poetry.group.dev.dependencies]
# Инструменты разработки
ipython = "^9.0.0"
django-debug-toolbar = "^4.4.0"
django-extensions = "^3.2.3"

# Линтинг и форматирование
black = {extras = ["d"], version = "^25.0.0"}
flake8 = "^7.0.0"
isort = "^6.0.0"
mypy = "^1.0.0"
pre-commit = "^3.0.0"

# Тестирование
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.12.0"
factory-boy = "^3.3.0"
faker = "^24.0.0"

# Типы для статического анализа
types-psycopg2 = "^2.9.21"
django-stubs = {extras = ["compatible-mypy"], version = "^5.0.0"}

[tool.poetry.group.test.dependencies]
# Только тестирование (для CI/CD)
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^5.0.0"
factory-boy = "^3.3.0"

[tool.poetry.group.lint.dependencies]
# Только линтинг (для CI/CD)
black = {extras = ["d"], version = "^25.0.0"}
flake8 = "^7.0.0"
isort = "^6.0.0"
mypy = "^1.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
skip-string-normalization = true
target-version = ['py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 119
skip = [".venv", "venv", "migrations"]
known_first_party = ["djangoproject"]

[tool.flake8]
max-line-length = 119
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    "migrations",
    "*.egg-info",
]
per-file-ignores = [
    "*/migrations/*:E501",
    "*/tests/*:S101",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
plugins = [
    "django_stubs.ext.mypy",
]

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "*test*",
    "*/tests/*",
]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "manage.py",
    "*/migrations/*",
]
ignore_errors = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "djangoproject.settings"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "--ds=djangoproject.settings",
    "--reuse-db",
]
markers = [
    "slow: marks tests as slow",
    "integration: integration tests",
    "unit: unit tests",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["djangoproject"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/migrations/*",
    "*/__pycache__/*",
    "manage.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "@admin.register",
    "@receiver",
    "# type: ignore",
]