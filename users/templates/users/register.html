{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center">Регистрация</h2>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Email -->
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control"
                               placeholder="example@mail.com" required>
                    </div>

                    <!-- Имя -->
                    <div class="mb-3">
                        <label class="form-label">Имя *</label>
                        <input type="text" name="first_name" class="form-control"
                               placeholder="Иван" required>
                    </div>

                    <!-- Фамилия -->
                    <div class="mb-3">
                        <label class="form-label">Фамилия *</label>
                        <input type="text" name="last_name" class="form-control"
                               placeholder="Иванов" required>
                    </div>

                    <!-- Телефон -->
                    <div class="mb-3">
                        <label class="form-label">Телефон</label>
                        <input type="text" name="phone" class="form-control"
                               placeholder="+7 (999) 123-45-67">
                    </div>

                    <!-- Страна -->
                    <div class="mb-3">
                        <label class="form-label">Страна</label>
                        <input type="text" name="country" class="form-control"
                               placeholder="Россия">
                    </div>

                    <!-- Аватар -->
                    <div class="mb-3">
                        <label class="form-label">Аватар</label>
                        <input type="file" name="avatar" class="form-control"
                               accept="image/*" id="avatar-input">
                        <div class="form-text">
                            Загрузите изображение (JPG, PNG, GIF, до 2 МБ).
                        </div>
                    </div>

                    <!-- Пароль 1 -->
                    <div class="mb-3">
                        <label class="form-label">Пароль *</label>
                        <input type="password" name="password1" class="form-control"
                               placeholder="Минимум 8 символов" required>
                    </div>

                    <!-- Пароль 2 -->
                    <div class="mb-3">
                        <label class="form-label">Подтверждение пароля *</label>
                        <input type="password" name="password2" class="form-control"
                               placeholder="Повторите пароль" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    </div>
                </form>

                <div class="mt-3 text-center">
                    <p>Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const avatarInput = document.getElementById('avatar-input');

        if (avatarInput) {
            avatarInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                const maxSize = 2 * 1024 * 1024; // 2 МБ

                if (file && file.size > maxSize) {
                    alert('Файл слишком большой! Максимальный размер: 2 МБ');
                    e.target.value = '';
                }
            });
        }
    });
</script>
{% endblock %}
