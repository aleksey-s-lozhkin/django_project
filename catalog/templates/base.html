<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Skystore - Главная{% endblock %}</title>
    <!-- Подключение Bootstrap CSS -->
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .pricing-card-title {
            font-size: 2.5rem;
            font-weight: 300;
            line-height: 1.2;
        }
        .card-header {
            background-color: #f8f9fa;
        }
        .box-shadow {
            box-shadow: 0 .3rem 1rem rgba(0,0,0,.15);
        }
        .border-bottom {
            border-bottom: 1px solid #dee2e6 !important;
        }
        .btn-outline-primary {
            border-width: 2px;
        }
        .product-image {
            height: 200px;
            object-fit: cover;
            width: 100%;
        }
    </style>
</head>
<body>
{% include 'inc_menu.html' %}

{% block content %}
{% endblock %}

{% include 'inc_footer.html' %}

<!-- Подключение Bootstrap JS -->
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
