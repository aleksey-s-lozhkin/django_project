<!-- Навигационная панель-->
<header class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 me-md-auto fw-normal">
        <a href="/" class="text-decoration-none text-dark">
            <i class="bi bi-shop"></i> Skystore
        </a>
    </h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary me-2" href="/">
            <i class="bi bi-house"></i> Главная
        </a>
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'catalog:product_list' %}">
            <i class="bi bi-list-ul"></i> Продукты
        </a>
        <a class="p-2 btn btn-success me-2" href="{% url 'catalog:product_create' %}">
            <i class="bi bi-plus-circle"></i> Добавить
        </a>
        {% if 'blog' in INSTALLED_APPS %}
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'blog:post_list' %}">
            <i class="bi bi-journal-text"></i> Блог
        </a>
        {% endif %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">
            <i class="bi bi-telephone"></i> Контакты
        </a>
    </nav>
</header>
